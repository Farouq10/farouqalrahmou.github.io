<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal website of Farouq Alrahmou.">
  <title>Farouq Alrahmou</title>
  <style>
    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 38px 24px 64px;
    }

    header {
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: normal;
      line-height: 1.3;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 22px;
    }

    a { color: #245a98; }
    nav a { text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid #245a98; outline-offset: 4px; }

    section {
      margin-bottom: 36px;
      scroll-margin-top: 24px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: normal;
    }

    p { margin: 0; }

    footer {
      border-top: 1px solid #ddd;
      padding-top: 16px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .page { padding: 28px 20px 48px; }
      h1 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Farouq Alrahmou</h1>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="#writing">Writing</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">About</h2>
        <p>This website is a work in progress. More to come.</p>
      </section>

      <section id="writing" aria-labelledby="writing-heading">
        <h2 id="writing-heading">Writing</h2>
        <p>Coming soon.</p>
      </section>

      <section id="projects" aria-labelledby="projects-heading">
        <h2 id="projects-heading">Projects</h2>
        <p>Coming soon.</p>
      </section>

      <section id="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Contact</h2>
        <p><a href="https://github.com/farouqalrahmou">GitHub</a></p>
      </section>
    </main>

    <footer>Farouq Alrahmou</footer>
  </div>
</body>
</html>
