<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The personal website of Farouq Alrahmou.">
  <title>Farouq Alrahmou</title>
  <style>
    /* Deliberately simple: one page, no framework, no effects. */
    :root {
      color-scheme: light;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: #202020;
      font: 16px/1.65 Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 66px 28px 90px;
    }

    header {
      padding-bottom: 20px;
      border-bottom: 1px solid #d8d8d8;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .layout {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 48px;
      padding-top: 34px;
    }

    nav {
      align-self: start;
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      font-size: 15px;
    }

    a {
      color: #174b84;
      text-underline-offset: 2px;
    }

    nav a {
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    a:focus-visible {
      outline: 2px solid #174b84;
      outline-offset: 3px;
    }

    main {
      max-width: 610px;
      min-width: 0;
    }

    p {
      margin: 0 0 16px;
    }

    section {
      margin: 0 0 36px;
      scroll-margin-top: 28px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
    }

    .quiet {
      color: #666;
    }

    @media (max-width: 640px) {
      .page {
        padding: 35px 22px 64px;
      }

      h1 {
        font-size: 27px;
      }

      .layout {
        display: block;
        padding-top: 22px;
      }

      nav {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px 20px;
        padding-bottom: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
<body>
  <div class="page" id="home">
    <header>
      <h1>Farouq Alrahmou</h1>
    </header>

    <div class="layout">
      <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#notes">Notes</a>
        <a href="#projects">Projects</a>
        <a href="study.html">Study</a>
        <a href="#contact">Contact</a>
      </nav>

      <main>
        <section aria-label="Introduction">
          <p>This is my personal website. I'll add things here as I go.</p>
        </section>

        <section id="notes" aria-labelledby="notes-heading">
          <h2 id="notes-heading">Notes</h2>
          <p class="quiet">Nothing here yet.</p>
        </section>

        <section id="projects" aria-labelledby="projects-heading">
          <h2 id="projects-heading">Projects</h2>
          <p class="quiet">Nothing here yet.</p>
        </section>

        <section id="contact" aria-labelledby="contact-heading">
          <h2 id="contact-heading">Contact</h2>
          <p><a href="https://github.com/farouqalrahmou">GitHub</a></p>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
